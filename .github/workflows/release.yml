name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag on main; also select this tag under Use workflow from"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Release tag validation
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      sha: ${{ steps.tag.outputs.sha }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      - name: Validate release tag
        id: tag
        run: node scripts/release-tag.mjs
        env:
          MANUSLIP_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

  package:
    name: Installer builds (${{ matrix.platform }}, ${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          - os: macos-15-intel
            platform: darwin
            arch: x64
          - os: macos-15
            platform: darwin
            arch: arm64
    steps:
      - name: Check out validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check architecture and dependency policy
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          node -e "if (process.arch !== process.env.EXPECTED_ARCH) process.exit(1)"
          npm run check:lockfile
          npm run audit:dependencies

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build application
        run: npm run build:app

      - name: Package unsigned installers
        id: package
        run: npm run package:release

      - name: Run packaged security smoke tests (Linux)
        if: runner.os == 'Linux'
        run: >-
          xvfb-run -a npm run test:packaged --
          test/e2e/shell.spec.ts test/e2e/files.spec.ts
          test/e2e/preview-security.spec.ts test/e2e/plugins-security.spec.ts
        env:
          MANUSLIP_PACKAGE_DIRECTORY: ${{ steps.package.outputs.output }}

      - name: Run packaged security smoke tests (Windows and macOS)
        if: runner.os != 'Linux'
        run: >-
          npm run test:packaged --
          test/e2e/shell.spec.ts test/e2e/files.spec.ts
          test/e2e/preview-security.spec.ts test/e2e/plugins-security.spec.ts
        env:
          MANUSLIP_PACKAGE_DIRECTORY: ${{ steps.package.outputs.output }}

      - name: Generate installer attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: ${{ steps.package.outputs.output }}/SHA256SUMS

      - name: Upload release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ steps.package.outputs.directory }}/report.json
            ${{ steps.package.outputs.output }}/SHA256SUMS
            ${{ steps.package.outputs.output }}/*.exe
            ${{ steps.package.outputs.output }}/*.dmg
            ${{ steps.package.outputs.output }}/*.AppImage
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish release
    needs: [validate, package]
    runs-on: ubuntu-22.04
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Check out validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      - name: Download release candidates
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: test/packaging/result/downloads

      - name: Revalidate release tag and artifacts
        run: |
          node scripts/release-tag.mjs
          node scripts/release-artifacts.mjs
        env:
          MANUSLIP_RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          MANUSLIP_RELEASE_VERSION: ${{ needs.validate.outputs.version }}

      - name: Verify provenance and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          RELEASE_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          for asset in test/packaging/result/staged/*; do
            if [ "$(basename "$asset")" = SHA256SUMS ]; then continue; fi
            gh attestation verify "$asset" \
              --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/release.yml" \
              --source-ref "refs/tags/$RELEASE_TAG" \
              --source-digest "$RELEASE_SHA" \
              --deny-self-hosted-runners
          done
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'A release already exists for this tag; review it instead of replacing assets.' >&2
            exit 1
          fi
          flags=()
          if [ "$RELEASE_PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" \
            test/packaging/result/staged/*.exe \
            test/packaging/result/staged/*.dmg \
            test/packaging/result/staged/*.AppImage \
            test/packaging/result/staged/SHA256SUMS \
            --verify-tag --title "$RELEASE_TAG" --generate-notes "${flags[@]}"
