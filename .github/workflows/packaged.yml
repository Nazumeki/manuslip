name: Packaged desktop

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaged-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaged:
    name: Packaged desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15-intel, macos-15]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run check:lockfile
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run verify:package
      - name: Packaged application workflows (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:packaged
      - name: Packaged application workflows (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:packaged
      - name: Windows install and uninstall
        if: runner.os == 'Windows'
        run: npm run test:installer
      - name: Retain test evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packaged-failure-${{ matrix.os }}
          path: |
            test/e2e/result/
            test/packaging/result/windows-installer-*/report.json
            test/packaging/result/windows-installer-*/*.png
          if-no-files-found: ignore
          retention-days: 7
