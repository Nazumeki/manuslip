name: Pandoc

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pandoc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pandoc:
    name: Pandoc (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest
          - macos-15-intel
          - macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm run check:lockfile

      - run: npm ci --no-audit --no-fund

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          pandoc-version: "3.13"

      - name: Select Pandoc for native tests
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { appendFileSync, realpathSync } from 'node:fs'
          const finder = process.platform === 'win32' ? 'where.exe' : 'which'
          const selected = execFileSync(finder, ['pandoc'], { encoding: 'utf8' }).trim().split(/\r?\n/)[0]
          const path = realpathSync(selected)
          const version = execFileSync(path, ['--version'], { encoding: 'utf8' })
          if (!/^pandoc 3\.13\r?\n/.test(version)) throw new Error('Expected Pandoc 3.13')
          appendFileSync(process.env.GITHUB_ENV, `MANUSLIP_TEST_PANDOC=${path}\n`)
          console.log(version.trim())
          NODE

      - run: npm run test:pandoc

      - run: npm run build:app

      - name: Pandoc desktop exports (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:pandoc:e2e

      - name: Pandoc desktop exports (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:pandoc:e2e

      - name: Retain test evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pandoc-failure-${{ matrix.os }}
          path: test/e2e/result/
          if-no-files-found: ignore
          retention-days: 7
